[package]
name = "mealie-cli"
version = "0.1.3"
edition = "2024"
description = "Human-friendly and scriptable CLI for the Mealie REST API"
repository = "https://github.com/damacus/mealie-cli"
license = "MIT"
readme = "README.md"

[[bin]]
name = "mealie"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "query", "rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[dev-dependencies]
mockito = "1.7"
